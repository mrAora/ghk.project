      <style>
        body {

        /* Navigation bar */
        .navbar {

          top: 0;
          width: 100%;
          background-color: #333;
          color: white;
          padding: 10px 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          z-index: 1000;
        }
    
        .navbar .logo {
          font-size: 20px;
          font-weight: bold;
        }
    
        .navbar .nav-links {
          display: flex;
          gap: 20px;
          justify-content:center;
          flex:1;
    
    
        }
    
        .navbar .nav-links a {
          color: white;
          text-decoration: none;
        }
    
        .menu-icon {
          display: none;
          font-size: 26px;
          cursor: pointer;
        }
    
        /* Mobile styles */
        @media (max-width: 768px) {
          .navbar .nav-links {
            display: none;
            flex-direction: column;
            background-color: #333;
            position: absolute;
            top: 60px;
            right: 20px;
            padding: 10px;
            border-radius: 5px;
          }
    
          .navbar .nav-links.active {
            display: flex;
          }
    
          .menu-icon {
            display: block;
          }
        }
